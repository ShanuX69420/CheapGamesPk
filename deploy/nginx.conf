# /etc/nginx/sites-available/cheapgamespk
#
# One origin for both apps: nginx sends /api and /admin to gunicorn and
# everything else to Next.js. That is what makes CORS a non-issue — the browser
# only ever talks to https://cheapgames.pk.
#
# This is the pre-certificate version. `certbot --nginx` rewrites it in place to
# add the :443 block and the http->https redirect, so install it as-is first.
# HTTP/2 lives on those generated :443 listeners and so cannot be set here —
# SETUP.md step 9 turns it on right after certbot runs.

upstream cheapgamespk_django {
    server 127.0.0.1:8000 fail_timeout=0;
}

upstream cheapgamespk_next {
    server 127.0.0.1:3000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name cheapgames.pk www.cheapgames.pk;

    # Product artwork uploaded through the admin.
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/cheapgamespk.access.log;
    error_log  /var/log/nginx/cheapgamespk.error.log;

    location /api/ {
        proxy_pass http://cheapgamespk_django;
        include /etc/nginx/snippets/cheapgamespk-proxy.conf;
    }

    location /admin/ {
        proxy_pass http://cheapgamespk_django;
        include /etc/nginx/snippets/cheapgamespk-proxy.conf;
    }

    # Admin CSS/JS. Whitenoise serves these from gunicorn with its own
    # far-future cache headers, so nginx just passes them through.
    location /static/ {
        proxy_pass http://cheapgamespk_django;
        include /etc/nginx/snippets/cheapgamespk-proxy.conf;
    }

    location /media/ {
        alias /srv/cheapgamespk/backend/media/;
        expires 30d;
        access_log off;
    }

    # Next.js build output is content-hashed and safe to cache hard.
    location /_next/static/ {
        proxy_pass http://cheapgamespk_next;
        include /etc/nginx/snippets/cheapgamespk-proxy.conf;
        proxy_cache_valid 200 60m;
        expires 365d;
        access_log off;
    }

    location / {
        proxy_pass http://cheapgamespk_next;
        include /etc/nginx/snippets/cheapgamespk-proxy.conf;
    }
}
