<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a1d24">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e3e6ec">

            <tr>
              <td style="background:#0d0f16;padding:18px 24px">
                <span style="font-size:18px;font-weight:800;color:#ffffff;letter-spacing:-0.3px">
                  {{ store_name }}
                </span>
              </td>
            </tr>

            <tr>
              <td style="padding:24px">
                {% block content %}{% endblock %}
              </td>
            </tr>

            <tr>
              <td style="padding:16px 24px;background:#fafbfc;border-top:1px solid #e3e6ec;font-size:12px;color:#6b7691;line-height:1.6">
                {% block footer %}
                  Questions about this order? Reply to this email{% if whatsapp_number %} or message us on WhatsApp at +{{ whatsapp_number }}{% endif %}.
                {% endblock %}
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
