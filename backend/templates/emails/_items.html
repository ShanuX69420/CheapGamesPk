<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:16px 0;border-collapse:collapse">
  {% for item in items %}
  <tr>
    <td style="padding:10px 0;border-bottom:1px solid #eef0f4;font-size:14px">
      <span style="color:#6b7691">{{ item.quantity }}&times;</span> {{ item.product_name }}
    </td>
    <td align="right" style="padding:10px 0;border-bottom:1px solid #eef0f4;font-size:14px;font-weight:600;white-space:nowrap">
      {{ order.currency }} {{ item.line_total|floatformat:0 }}
    </td>
  </tr>
  {% endfor %}
  <tr>
    <td style="padding:12px 0;font-size:15px;font-weight:700">Total</td>
    <td align="right" style="padding:12px 0;font-size:18px;font-weight:800;white-space:nowrap">
      {{ order.currency }} {{ order.total|floatformat:0 }}
    </td>
  </tr>
</table>
